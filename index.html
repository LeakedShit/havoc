<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOTNAME</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#050505;--royal:#1c1c20;--blue:#48484f;--vio:#3a3a40;--lav:#9a9aa2;--ice:#e4e4e8;--text:#F5F5F7;--muted:#a8a8b0;--line:rgba(255,255,255,.2);--glass:rgba(22,22,24,.5);--win:rgba(16,16,18,.8);color-scheme:dark;box-sizing:border-box}
:root[data-theme="light"]{--text:#F2F5FF}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--text:#F2F5FF}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:Inter,-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--text);background:var(--navy);font-size:14px;user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Wallpaper */
.wall{position:fixed;inset:0;z-index:0;overflow:hidden;background:
 radial-gradient(80% 55% at 25% 0%,rgba(75,39,255,.85),transparent 62%),
 radial-gradient(70% 60% at 100% 100%,rgba(23,77,255,.65),transparent 62%),
 linear-gradient(165deg,#3a1fd0 0%,#1b1b9e 28%,#05082F 55%,#0b2bbd 100%);transition:filter .6s}
[data-wp="graphite"] .wall{filter:grayscale(1) contrast(1.15)}
[data-wp="silver"] .wall{filter:grayscale(1) brightness(1.5) contrast(.95)}
[data-wp="ink"] .wall{filter:grayscale(1) brightness(.55)}
.wall svg{position:absolute;inset:0;width:100%;height:100%}
.wall .gl{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:dr 24s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(3%,-3%) scale(1.06)}}

/* Menu bar */
.mb{position:fixed;top:0;left:0;right:0;height:30px;z-index:9000;display:flex;align-items:center;justify-content:space-between;padding:0 12px;padding-top:env(safe-area-inset-top,0px);height:calc(30px + env(safe-area-inset-top,0px));background:rgba(10,10,12,.4);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(160,180,255,.12);font-size:13px;font-weight:500}
.mb>div{display:flex;align-items:center;gap:2px}
.mi{background:none;border:0;padding:3px 10px;border-radius:6px;font-weight:500}
.mi:hover,.mi.on{background:rgba(255,255,255,.16)}.mi.app{font-weight:700}
.sys{display:flex;gap:12px;align-items:center;padding-right:4px}
.sys button{background:none;border:0;display:flex;padding:2px}
.dd{position:fixed;z-index:9500;min-width:210px;padding:6px;border-radius:12px;background:rgba(18,18,20,.85);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid var(--line);box-shadow:0 20px 50px rgba(2,4,40,.7);display:none}
.dd.show{display:block;animation:pop .14s}
.dd button{display:flex;justify-content:space-between;gap:20px;width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:7px}
.dd button:hover,.dd button:focus-visible{background:var(--blue)}
.dd hr{border:0;border-top:1px solid var(--line);margin:5px 4px}.dd .k{opacity:.55}
@keyframes pop{from{opacity:0;transform:scale(.97)}}

/* Windows */
.win{position:fixed;z-index:10;display:flex;flex-direction:column;border-radius:14px;background:var(--win);backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);border:1px solid var(--line);box-shadow:0 30px 70px -10px rgba(1,3,35,.8),inset 0 1px 0 rgba(255,255,255,.15);overflow:hidden;animation:open .22s cubic-bezier(.2,.9,.3,1);transition:opacity .2s,transform .22s,left .2s,top .2s,width .2s,height .2s}
@keyframes open{from{opacity:0;transform:scale(.92)}}
.win.closing{opacity:0;transform:scale(.94);pointer-events:none}
.win.min{opacity:0;transform:translateY(60vh) scale(.3);pointer-events:none;visibility:hidden}
.win.max{left:10px!important;top:38px!important;width:calc(100vw - 20px)!important;height:calc(100vh - 128px)!important}
.win.drag{transition:opacity .2s,transform .2s}
.win:not(.act){box-shadow:0 14px 40px -10px rgba(1,3,35,.7)}.win:not(.act) .tb{opacity:.7}
.tb{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;background:rgba(255,255,255,.06);border-bottom:1px solid var(--line);cursor:grab;touch-action:none;flex:none}
.tb h2{flex:1;text-align:center;font-size:13px;font-weight:600;margin-right:50px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:8px;z-index:1}
.dots button{width:13px;height:13px;border-radius:50%;border:0;padding:0;position:relative}
.dots .r{background:#ff5f57}.dots .y{background:#febc2e}.dots .g{background:#28c840}
.dots:hover button::after{content:"";position:absolute;inset:4px;border-radius:50%;background:rgba(0,0,0,.45)}
.bd{flex:1;overflow:auto;padding:22px;user-select:text;font-size:14px;line-height:1.6}
.bd h1{font-size:1.5rem;letter-spacing:-.02em;margin-bottom:6px}.bd h3{margin:18px 0 6px;font-size:1rem}
.bd p,.bd li{color:#d6dcff}.bd ul{padding-left:20px}.mut{color:var(--muted)!important}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.1);font-weight:600;transition:.2s}
.btn:hover{background:rgba(255,255,255,.18)}
.btn.p{background:#f5f5f7;color:#0a0a0c;border-color:#fff;box-shadow:0 8px 24px -8px rgba(255,255,255,.5)}.btn.p:hover{background:#fff}
.btn.big{padding:14px 28px;font-size:1rem}
.logo{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ice),var(--vio));box-shadow:0 12px 30px -8px var(--vio)}
.logo svg{width:40px;height:40px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.tag{font-size:.7rem;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.12);color:var(--ice)}
.note{margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);color:#d8d8dc;font-size:.85rem}
.item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.item .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--lav))}
.item b{display:block}
.split{display:grid;grid-template-columns:170px 1fr;height:100%}
.side{padding:12px 8px;border-right:1px solid var(--line);background:rgba(3,5,40,.3);overflow:auto}
.side button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:8px;color:var(--muted)}
.side button:hover{color:#fff}.side button.on{background:rgba(120,101,255,.35);color:#fff}
.main{padding:22px;overflow:auto;user-select:text}
.inp{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(3,5,40,.5);color:#fff;font:inherit;outline:none}
.inp:focus{border-color:var(--ice)}
.cmd{padding:12px 14px;margin-top:10px;border-radius:12px;background:rgba(3,5,40,.45);border:1px solid var(--line)}
.cmd code{font-family:ui-monospace,Menlo,monospace;color:var(--ice);font-weight:600;cursor:pointer}
.cmd small{display:block;color:var(--muted)}.cmd kbd{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;opacity:.8}
.pills{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.pills button{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--muted)}
.pills button.on{background:var(--vio);color:#fff;border-color:transparent}
.sw{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.tg{width:44px;height:26px;border-radius:99px;border:0;background:rgba(255,255,255,.2);position:relative;transition:.2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tg[aria-checked="true"]{background:#8a8a92}.tg[aria-checked="true"]::after{transform:translateX(18px)}

/* Dock */
.dockw{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:8000;display:flex;justify-content:center;padding:0 8px;pointer-events:none}
.dock{pointer-events:auto;display:flex;align-items:flex-end;gap:8px;padding:8px 12px;border-radius:26px;background:var(--glass);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border:1px solid var(--line);box-shadow:0 20px 50px -10px rgba(1,3,35,.8),inset 0 1px 0 rgba(255,255,255,.2);max-width:100%}
.dk{position:relative;width:52px;height:52px;border-radius:14px;border:0;padding:0;display:grid;place-items:center;transition:transform .18s cubic-bezier(.3,1.4,.5,1);flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 14px -4px rgba(1,3,35,.7)}
.dk svg{width:28px;height:28px;stroke-width:1.8;color:#fff}
.dk:hover,.dk:focus-visible{transform:translateY(-10px) scale(1.22)}
.dk::before{content:attr(data-tip);position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);white-space:nowrap;padding:4px 10px;border-radius:8px;background:rgba(14,14,16,.92);border:1px solid var(--line);font-size:12px;opacity:0;pointer-events:none;transition:.15s}
.dk:hover::before,.dk:focus-visible::before{opacity:1}
.dk::after{content:"";position:absolute;bottom:-7px;width:4px;height:4px;border-radius:50%;background:#fff;opacity:0}
.dk.open::after{opacity:.9}.dk.minz::after{opacity:.4}
.dk{background:linear-gradient(145deg,#5a5a62,#17171a)!important}.sep{width:1px;height:44px;background:var(--line);align-self:center;flex:none}
@media(max-width:720px){.dock{overflow-x:auto;gap:6px;scrollbar-width:none}.dk{width:44px;height:44px}.dk:hover{transform:none}.dk::before{display:none}
.win,.win.max{left:8px!important;top:36px!important;width:calc(100vw - 16px)!important;height:calc(100vh - 118px)!important}
.mb .mi:not(.app){display:none}.split{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.side button{width:auto;white-space:nowrap}}

/* Spotlight / context */
.spot{position:fixed;inset:0;z-index:9800;display:none;align-items:flex-start;justify-content:center;padding-top:16vh;background:rgba(2,3,30,.3)}
.spot.show{display:flex}
.sp{width:min(560px,92vw);border-radius:18px;background:rgba(18,18,20,.88);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--line);box-shadow:0 30px 80px rgba(1,3,35,.8);padding:10px;animation:pop .15s}
.sp input{width:100%;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:18px;padding:10px 12px}
.sp button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:10px}
.sp button:hover,.sp button.on{background:var(--blue)}
.ghost{font-size:11px;opacity:.5;position:fixed;bottom:84px;left:0;right:0;text-align:center;z-index:1;pointer-events:none}
html.rm *{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wall" aria-hidden="true">

<linearGradient id="s1" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#9CBFFF" stop-opacity="0"/><stop offset=".55" stop-color="#9CBFFF"/><stop offset="1" stop-color="#7865FF" stop-opacity=".3"/></linearGradient>

/* ===== Configure here ===== */
const CFG={name:"Havoc",invite:"",support:"",docsUrl:"",apiUrl:"https://api.havoc.website",commandsUrl:"./commands.json",version:"v0.0.0 (placeholder)",updated:"October 11, 2026"};
const FEATURES=[["shield","Moderation","Placeholder — describe your moderation tools."],["term","Custom commands","Placeholder — describe custom command support."],["zap","Automation","Placeholder — describe automation and utilities."],["chart","Analytics","Placeholder — describe server insights."],["pal","Customization","Placeholder — describe configuration options."]];
let COMMANDS=[["/help","General","Show available commands.","/help","None"],["/ping","General","Check bot latency.","/ping","None"],["/ban","Moderation","Ban a member.","/ban @user reason","Ban Members"],["/kick","Moderation","Remove a member.","/kick @user reason","Kick Members"],["/config","Admin","Open server configuration.","/config view","Manage Server"],["/remind","Utility","Set a reminder.","/remind 10m stretch","None"]];
const DOCS=[["Installation","Placeholder: how to invite the bot and which permissions it needs."],["Setup","Placeholder: first-time configuration steps."],["Commands","Placeholder: reference for each command."],["Configuration","Placeholder: server settings and options."],["Troubleshooting","Placeholder: common problems and fixes."]];
const TOS=[
["Acceptance of Terms","By adding Havoc to a server, using its commands, or logging in to the dashboard, you agree to these terms and to Discord's Terms of Service and Community Guidelines. If you do not agree, do not use the service."],
["Use of the Service","Havoc is a moderation and server-management bot. You may use it to manage communities you are authorised to manage. You must not use it to harass or surveil people, to evade Discord's rules, to attack or disrupt the service, to attempt unauthorised access to the dashboard or API, or for anything illegal. Server owners are responsible for how the bot is configured and for the actions their staff take with it."],
["Data and Content","You keep ownership of your content. You give us permission to process it as needed to provide the features you enable, as described in the Privacy Policy. Server staff are responsible for telling their members that moderation, logging and verification tools are in use, and for complying with the laws that apply to them."],
["Availability and Disclaimer","Havoc is provided as is and as available, without warranties of any kind. We may change, limit or discontinue features at any time, and the bot may be unavailable due to maintenance, outages or Discord issues. Automated actions such as AutoMod, anti-nuke, raid mode and verification can make mistakes, so staff should review their settings and logs. To the extent permitted by law, we are not liable for indirect or consequential losses arising from use of the service."],
["Termination","You can stop using Havoc at any time by removing it from your server. We may restrict or remove access for any user or server that breaks these terms, abuses the service, or puts others at risk."],
["Changes and Contact","We may update these terms; continued use after a change means you accept the new version. For questions, join the support server linked on this site or use the contact method listed there."]
];
const PRIV=[
["Information We Collect","Havoc only receives the data Discord provides to bots in the servers where it is installed. Depending on which features a server turns on, this can include: (a) Discord IDs, usernames, avatars, nicknames and role membership of members; server, channel and role IDs; (b) message content, which is read to run AutoMod filters, blocked words, triggers and commands; (c) message counts per user and channel, only when message tracking is enabled; (d) moderation records such as cases, warnings, staff notes, reasons, moderator IDs and timestamps; (e) verification and alt-detection data such as account age, join time, verification attempts, risk scores, and possible links between accounts (optional writing-style matching and link evidence can be switched off by server staff); (f) ticket contents and transcripts; (g) server settings, saved roles for sticky roles, reaction roles, giveaway entries, AFK statuses and reminders; (h) recently deleted or edited messages held briefly for the snipe commands. If you log in to the dashboard we also receive your Discord ID, username, avatar and the list of servers you can manage, and we set a session cookie to keep you logged in."],
["How Information Is Used","We use this information only to run the bot and dashboard: enforcing moderation and AutoMod rules, protecting servers against raids and nukes, verifying members, handling tickets, logging actions to channels chosen by server staff, showing analytics, and letting authorised users manage settings. We do not sell your data, and we do not use it for advertising or to build profiles for unrelated purposes."],

function parseCmds(){let cat="General";const out=[];RAW.split("\n").forEach(l=>{l=l.trim();if(!l)return;if(l[0]==="#"){cat=l.slice(1).trim();return}const p=l.split("::").map(s=>s.trim());let u=p[0];const po=u[0]==="~";if(po)u="<prefix>"+u.slice(1);const t=u.split(" ");const i=t.findIndex((x,j)=>j>0&&/^[<\[]/.test(x));out.push([(i<0?t:t.slice(0,i)).join(" "),cat,(p[1]||"")+(po?" (prefix only)":""),u,p[2]||"None"])});return out}
COMMANDS=parseCmds();let LIVE=true;fetch(CFG.commandsUrl,{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{if(Array.isArray(d)&&d.length){COMMANDS=d.map(c=>Array.isArray(c)?c:[c.name,c.category||"General",c.description||"",c.usage||c.name,c.permissions||"None"]);LIVE=true}}).catch(()=>{});
const wins={};let z=100,cascade=0;
const setRM=v=>{document.documentElement.classList.toggle("rm",v);store.set("rm",v?"1":"0")};
const setWP=w=>{document.documentElement.dataset.wp=w;store.set("wp",w)};
setRM(store.get("rm")==="1");const w0=store.get("wp");setWP(["graphite","silver","ink"].includes(w0)?w0:"graphite");

function openApp(id){const a=APPS[id];if(!a)return;
 if(a.url&&CFG[a.url]){window.open(CFG[a.url],"_blank","noopener");return}
 const w=wins[id];if(w){if(w.el.classList.contains("min"))w.el.classList.remove("min");focus(id);return}
 const el=document.createElement("div");el.className="win";el.setAttribute("role","dialog");el.setAttribute("aria-label",a.t);
 const n=cascade++%6;el.style.cssText=`width:${a.w}px;height:${a.h}px;left:${Math.max(10,(innerWidth-a.w)/2-60+n*30)}px;top:${60+n*30}px`;
 el.dataset.l=el.style.left;el.dataset.t=el.style.top;
 el.innerHTML=`<div class="tb"><div class="dots"><button class="r" aria-label="Close"></button><button class="y" aria-label="Minimize"></button><button class="g" aria-label="Zoom"></button></div><h2>${a.t}</h2></div>`;
 const holder=document.createElement("div");holder.style.cssText="flex:1;display:flex;flex-direction:column;min-height:0";holder.innerHTML=a.body();holder.firstElementChild.style.flex="1";el.append(holder);
 document.body.append(el);wins[id]={el};
 el.onpointerdown=()=>focus(id);
 $(".r",el).onclick=()=>closeApp(id);$(".y",el).onclick=()=>{el.classList.add("min");dockState();const nx=Object.keys(wins).filter(k=>!wins[k].el.classList.contains("min")).pop();nx&&focus(nx)};
 $(".g",el).onclick=()=>el.classList.toggle("max");
 el.querySelectorAll("[data-open]").forEach(x=>x.onclick=()=>openApp(x.dataset.open));
 a.init&&a.init(holder);drag(el);focus(id)}
function focus(id){const w=wins[id];if(!w)return;w.el.style.zIndex=++z;Object.values(wins).forEach(x=>x.el.classList.toggle("act",x===w));dockState()}
function closeApp(id){const w=wins[id];if(!w)return;delete wins[id];w.el.classList.add("closing");setTimeout(()=>w.el.remove(),200);dockState()}
function topWin(){return Object.keys(wins).filter(k=>!wins[k].el.classList.contains("min")).sort((a,b)=>wins[b].el.style.zIndex-wins[a].el.style.zIndex)[0]}
function resetWins(){cascade=0;Object.values(wins).forEach((w,i)=>{w.el.classList.remove("max","min");w.el.style.left=(Math.max(10,innerWidth/2-300)+i*30)+"px";w.el.style.top=(60+i*30)+"px"});dockState()}
function drag(el){const tb=$(".tb",el);tb.onpointerdown=e=>{if(e.target.closest(".dots")||innerWidth<=720||el.classList.contains("max"))return;const r=el.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;el.classList.add("drag");tb.setPointerCapture(e.pointerId);tb.style.cursor="grabbing";
 tb.onpointermove=m=>{el.style.left=Math.min(innerWidth-80,Math.max(80-r.width,m.clientX-dx))+"px";el.style.top=Math.min(innerHeight-60,Math.max(34,m.clientY-dy))+"px"};
 tb.onpointerup=()=>{tb.onpointermove=tb.onpointerup=null;tb.style.cursor="";el.classList.remove("drag")}};
 tb.ondblclick=e=>{if(!e.target.closest(".dots"))el.classList.toggle("max")}}

/* Dock */
$("#dock").innerHTML=ORDER.map(k=>{if(k==="|")return'<div class="sep"></div>';const a=APPS[k];return`<button class="dk" data-id="${k}" data-tip="${a.t.replace("About ","")}" aria-label="${a.t}" style="background:linear-gradient(145deg,${a.g})">${ic(a.i)}</button>`}).join("");
document.querySelectorAll(".dk").forEach(b=>b.onclick=()=>openApp(b.dataset.id));
function dockState(){document.querySelectorAll(".dk").forEach(b=>{const w=wins[b.dataset.id];b.classList.toggle("open",!!w&&!w.el.classList.contains("min"));b.classList.toggle("minz",!!w&&w.el.classList.contains("min"))})}

/* Menus */
const sel=()=>{const s=getSelection();return s&&s.toString()};
const MENUS={[N]:()=>[["About This Website",()=>openApp("site")],"-",["Close All Windows",closeAll]],
File:()=>[["Open About",()=>openApp("about")],["Close Window  ⌘W",()=>{const t=topWin();t&&closeApp(t)}],["Close All Windows",closeAll]],
Edit:()=>[["Copy",()=>{sel()&&navigator.clipboard&&navigator.clipboard.writeText(sel()).catch(()=>{})}],["Select All",()=>{const t=topWin();if(t){const r=document.createRange();r.selectNodeContents($(".bd,.main",wins[t].el)||wins[t].el);const s=getSelection();s.removeAllRanges();s.addRange(r)}}]],
View:()=>[["Show Desktop",()=>{Object.values(wins).forEach(w=>w.el.classList.add("min"));dockState()}],["Reset Windows",resetWins],["Search…  ⌘K",openSpot]],
Window:()=>Object.keys(wins).length?Object.keys(wins).map(k=>[APPS[k].t,()=>{wins[k].el.classList.remove("min");focus(k)}]):[["No open windows",()=>{}]],
Help:()=>[["About the Bot",()=>openApp("about")],["Dashboard",()=>openApp("dash")],["Support Server",()=>openApp("support")]]};
function closeAll(){Object.keys(wins).forEach(closeApp)}
const mbox=$("#menus"),dd=$("#dd");let openM=null;
mbox.innerHTML=Object.keys(MENUS).map((k,i)=>`<button class="mi ${i?"":"app"}" aria-haspopup="true" data-m="${k}">${i?k:ic("bot")+" "+k}</button>`).join("");
function showMenu(btn){hideAll();openM=btn;btn.classList.add("on");const r=btn.getBoundingClientRect();fill(dd,MENUS[btn.dataset.m]());dd.style.left=r.left+"px";dd.style.top=r.bottom+2+"px";dd.classList.add("show")}
function fill(box,items){box.innerHTML=items.map(i=>i==="-"?"<hr>":`<button role="menuitem">${i[0].split("  ")[0]}<span class="k">${i[0].split("  ")[1]||""}</span></button>`).join("");const act=items.filter(i=>i!=="-");box.querySelectorAll("button").forEach((b,j)=>b.onclick=()=>{hideAll();act[j][1]()})}
function hideAll(){dd.classList.remove("show");$("#ctx").classList.remove("show");openM&&openM.classList.remove("on");openM=null}
mbox.querySelectorAll(".mi").forEach(b=>{b.onclick=e=>{e.stopPropagation();openM===b?hideAll():showMenu(b)};b.onmouseenter=()=>openM&&openM!==b&&showMenu(b)});
document.addEventListener("click",hideAll);
document.addEventListener("contextmenu",e=>{if(e.target.closest(".win,.mb,.dock"))return;e.preventDefault();const c=$("#ctx");fill(c,[["Search…",openSpot],["Show Desktop",MENUS.View()[0][1]],["Reset Windows",resetWins],["Close All Windows",closeAll],"-",["About This Website",()=>openApp("site")]]);c.style.left=Math.min(e.clientX,innerWidth-230)+"px";c.style.top=Math.min(e.clientY,innerHeight-220)+"px";c.classList.add("show")});

/* Clock */
const clk=()=>{$("#clock").textContent=new Date().toLocaleString([],{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}).replace(",","")};clk();setInterval(clk,1000);

/* Spotlight */
const sp=$("#spot"),spIn=$("#spIn");let spSel=0;
const spList=()=>{const q=spIn.value.toLowerCase();return Object.keys(APPS).filter(k=>APPS[k].dock&&(APPS[k].t+" "+k).toLowerCase().includes(q))};
const spDraw=()=>{const l=spList();spSel=Math.min(spSel,Math.max(0,l.length-1));$("#spRes").innerHTML=l.map((k,i)=>`<button class="${i===spSel?"on":""}" data-k="${k}">${ic(APPS[k].i)} ${APPS[k].t}</button>`).join("");$("#spRes").querySelectorAll("button").forEach(b=>b.onclick=()=>{closeSpot();openApp(b.dataset.k)})};
function openSpot(){hideAll();sp.classList.add("show");spIn.value="";spSel=0;spDraw();setTimeout(()=>spIn.focus(),10)}
function closeSpot(){sp.classList.remove("show")}
spIn.oninput=()=>{spSel=0;spDraw()};
sp.onclick=e=>{if(e.target===sp)closeSpot()};
if(location.hash==="#dashboard")setTimeout(()=>openApp("dash"),300);$("#mbSearch").onclick=e=>{e.stopPropagation();openSpot()};
document.addEventListener("keydown",e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openSpot();return}
 if(e.key==="Escape"){hideAll();closeSpot();return}
 if(sp.classList.contains("show")){const n=spList().length;if(e.key==="ArrowDown"){e.preventDefault();spSel=(spSel+1)%n;spDraw()}if(e.key==="ArrowUp"){e.preventDefault();spSel=(spSel-1+n)%n;spDraw()}if(e.key==="Enter"){const k=spList()[spSel];if(k){closeSpot();openApp(k)}}}
 else if((e.altKey)&&e.key.toLowerCase()==="w"){const t=topWin();t&&closeApp(t)}});
</script>
